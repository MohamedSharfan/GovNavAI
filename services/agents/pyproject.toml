[project]
name = "govnav-agents"
version = "0.1.0"
description = "GovNavAI multi-agent service (Google ADK + Gemini) for verified Sri Lankan government-service navigation"
authors = [
    { name = "Mohamed Sharfan", email = "sharfansaleem72@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.165",
    "google-adk>=2.15",
    "google-cloud-firestore>=2.34",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pydantic>=2.14",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.54",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[project.scripts]
govnav-api = "govnav_agents.api.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC", "S"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]
"src/govnav_agents/agents/labels.py" = ["E501"]  # translated sentences

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["rank_bm25.*", "google.cloud.*"]
ignore_missing_imports = true
